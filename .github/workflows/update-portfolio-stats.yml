name: Update portfolio stats

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  update:
    if: github.event.issue.title == 'run-portfolio-stats-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update portfolio numbers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Minecraft Bedrock projects with 6M+ downloads': 'Minecraft Bedrock projects with 7.7M+ downloads',
              '<dd><span data-count="6" data-suffix="M+">6M+</span></dd>': '<dd><span data-count="7.7" data-suffix="M+">7.7M+</span></dd>',
              '<dt>earned from creator work</dt>\n            <dd><span data-count="4" data-prefix="$" data-suffix="K+">$4K+</span></dd>': '<dt>on one project</dt>\n            <dd><span data-count="2.4" data-suffix="M+">2.4M+</span></dd>',
              'breaking. Six million downloads later, still at it.': 'breaking. More than 7.7 million downloads later, still at it.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update portfolio statistics to 7.7M downloads"
          git push
