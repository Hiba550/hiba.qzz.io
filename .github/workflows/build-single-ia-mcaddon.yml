name: Build single IA mcaddon

on:
  push:
    paths:
      - ".github/workflows/build-single-ia-mcaddon.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild single mcaddon from existing repository parts
        shell: bash
        run: |
          set -euo pipefail
          out="iaport/downloads/ImmersiveAircraft-Bedrock-1.0-Alpha.mcaddon"
          cat iaport/downloads/parts/ia-alpha-*.part > "$out"

          expected_sha="79b95e8bf6c76956329259d49ffa112a0eec558d77e7c49137b1f66444dca920"
          actual_sha="$(sha256sum "$out" | awk '{print $1}')"
          expected_size="4244574"
          actual_size="$(stat -c%s "$out")"

          echo "SHA-256: $actual_sha"
          echo "Size: $actual_size"

          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"

      - name: Commit single file and remove temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "iaport/downloads/ImmersiveAircraft-Bedrock-1.0-Alpha.mcaddon"
          git rm -r "iaport/downloads/parts"
          git rm ".github/workflows/build-single-ia-mcaddon.yml"

          git commit -m "Store Immersive Aircraft alpha as a single mcaddon"
          git push
